name: v1-travel
services:
  web:
    build: .
    image: v1-travel-web:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
